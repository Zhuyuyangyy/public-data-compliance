version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: public-data-compliance-api
    ports:
      - "8013:8013"
    volumes:
      - pdc-data:/app/backend/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

volumes:
  pdc-data:
    driver: local
